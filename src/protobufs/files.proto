syntax = "proto3";

package files;

option go_package = "./protobufs;protobufs";

import "google/protobuf/empty.proto";


service FilesService {

   rpc UploadStream(stream UploadBinaryRequest) returns (google.protobuf.Empty) {}

   rpc ReadStream(ReadDeleteRequest) returns (stream ReadResponse) {}

   rpc Delete(ReadDeleteRequest) returns (google.protobuf.Empty) {}

   rpc List(ListRequest) returns (ListResponse) {}

   rpc Rename(RenameRequest) returns (google.protobuf.Empty) {}

   rpc CreateContainer(ContainerRequest) returns (google.protobuf.Empty) {}

   rpc RenameContainer(RenameRequest) returns (google.protobuf.Empty) {}

   rpc DeleteContainer(ContainerRequest) returns (google.protobuf.Empty) {}
}

message UploadBinaryRequest {
  string remotePath = 1;
  bytes data = 2;
  bool overwrite = 3;
}

message ReadResponse {
  bytes data = 1;
}

message ReadDeleteRequest {
  string remotePath = 1;
}

message ListRequest {
  string prefix = 1;
  // Default 1000, max 10000
  int32 pageSize = 2;
  // nextPageToken from the previous response, empty for the first page
  string pageToken = 3;
}

message ListResponse {
  repeated string remotePaths = 1;
  // Empty when there are no more files
  string nextPageToken = 2;
}


// For Rename, newName is a file name in the same directory. For RenameContainer, remotePath is the old container name
message RenameRequest {
  string remotePath = 1;
  string newName = 2;
}


message ContainerRequest {
  string name = 1;
}

